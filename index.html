<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>试映排期台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">纸质放映胶片 · 试映安排</p>
          <h1>试映排期台</h1>
        </div>
        <div class="hero-stats">
          <div>
            <span>已排定</span>
            <strong id="statScheduled">0</strong>
          </div>
          <div>
            <span>待排</span>
            <strong id="statPending">0</strong>
          </div>
          <div>
            <span>已完成</span>
            <strong id="statDone">0</strong>
          </div>
          <div>
            <span>未修复片段</span>
            <strong id="statUnrepaired">0</strong>
          </div>
        </div>
      </header>

      <div id="notice" class="notice" hidden></div>

      <section class="layout">
        <aside class="panel">
          <h2>片段底片</h2>
          <p class="panel-tip">修改修复状态或时长后，相关未来场次自动退回待排，已完成场次保留。</p>
          <div id="segmentList" class="segment-list"></div>
        </aside>

        <section class="panel schedule-panel">
          <h2>排片</h2>
          <form id="scheduleForm" class="schedule-form">
            <label>
              片段
              <select id="segmentSelect"></select>
            </label>
            <label>
              影厅
              <select id="hallSelect"></select>
            </label>
            <label>
              放映员
              <select id="projectionistSelect"></select>
            </label>
            <label>
              日期
              <input id="dateInput" type="date" required />
            </label>
            <label>
              开始时间
              <input id="startInput" type="time" required value="14:00" />
            </label>
            <div class="form-foot">
              <span id="endHint" class="end-hint"></span>
              <button class="primary" type="submit">加入待存批次</button>
            </div>
          </form>
          <p class="panel-tip">时段为连续整块，结束时间按片段当前时长自动计算。</p>

          <div class="panel-head">
            <h2>待存批次</h2>
            <div class="batch-actions">
              <button id="saveBatchBtn" class="primary" type="button">保存排期</button>
              <button id="clearBatchBtn" type="button">清空</button>
            </div>
          </div>
          <div id="batchErrors" class="batch-errors" hidden></div>
          <div id="batchList" class="batch-list"></div>

          <div class="panel-head">
            <h2>排期表</h2>
            <span id="scheduleCount"></span>
          </div>
          <div id="scheduleList" class="schedule-list"></div>
        </section>

        <aside class="panel">
          <h2>提醒</h2>
          <div id="reminderList" class="warning-list"></div>
          <h2 class="block-gap">影厅负载</h2>
          <div id="hallLoads" class="load-list"></div>
        </aside>
      </section>
    </main>

    <script src="rules.js"></script>
    <script src="store.js"></script>
    <script src="app.js"></script>
  </body>
</html>
